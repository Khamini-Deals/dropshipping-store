<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Free Dropshipping Store</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: #1a1a1a;
      color: white;
      width: 100%;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }

    .product-card {
      background: white;
      max-width: 400px;
      margin: 2rem auto;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      border-radius: 12px;
    }

    .product-info {
      padding: 1rem 0;
    }

    .product-info h2 {
      margin: 0 0 0.5rem;
    }

    .buy-btn {
      background: #007bff;
      color: white;
      border: 2px solid #0056b3;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .buy-btn:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    .buy-btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 600px) {
      .product-card {
        margin: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>🛍️ My Cool Dropshipping Store</header>

  <div class="product-card">
    <img src="https://via.placeholder.com/400x300?text=Awesome+Product" alt="Product Image" />
    <div class="product-info">
      <h2>Smart Wireless Earbuds</h2>
      <p>High quality sound with noise cancellation. Only ₹999!</p>
      <a class="buy-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdExampleFormID/viewform?usp=pp_url&entry.123456=Smart+Wireless+Earbuds">Buy Now</a>
    </div>
  </div>

</body>
</html>
