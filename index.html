<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Free Dropshipping Store</title>
<style>
  /* Basic reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f8;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    background-color: #111;
    color: white;
    width: 100%;
    padding: 1rem;
    font-size: 1.5rem;
    text-align: center;
    letter-spacing: 1px;
  }

  .product-card {
    background-color: white;
    margin: 2rem;
    max-width: 400px;
    width: 90%;
    border-radius: 16px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transition: transform 0.3s ease;
  }

  .product-card:hover {
    transform: scale(1.02);
  }

  .product-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  .product-info {
    padding: 1.2rem;
  }

  .product-info h2 {
    margin-bottom: 0.5rem;
    font-size: 1.4rem;
  }

  .product-info p {
    margin-bottom: 1rem;
    font-size: 1rem;
    color: #555;
  }

  .buy-btn {
    display: inline-block;
    padding: 0.8rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    color: #007bff;
    border: 2px solid #007bff;
    border-radius: 50px;
    background-color: transparent;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease;
  }

  .buy-btn:hover {
    background-color: #007bff;
    color: white;
    transform: scale(1.05);
  }

  .buy-btn:active {
    transform: scale(0.95);
  }

  /* Responsive design */
  @media (max-width: 768px) {
    header {
      font-size: 1.3rem;
      padding: 0.8rem;
    }

    .product-card {
      margin: 1rem;
    }

    .buy-btn {
      width: 100%;
      display: block;
      text-align: center;
    }
  }
</style>
</head>
<body>

  <header>🛍️ My Cool Dropshipping Store</header>

  <div class="product-card">
    <img src="https://via.placeholder.com/400x300?text=Awesome+Product" alt="Product Image" />
    <div class="product-info">
      <h2>Smart Wireless Earbuds</h2>
      <p>High quality sound with noise cancellation. Only ₹999!</p>
      <a class="buy-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdExampleFormID/viewform?usp=pp_url&entry.123456=Smart+Wireless+Earbuds">Buy Now</a>
    </div>
  </div>

</body>
</html>
